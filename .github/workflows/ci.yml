name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/glucoseiq-packages' && github.event.pull_request.head.repo.full_name == github.repository && 'Release branch CI (handled by release workflow)' || 'Build & test (Node 24)' }}
    if: github.event_name != 'pull_request' || github.head_ref != 'release/glucoseiq-packages' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Changesets base branch
        run: |
          git show-ref --verify --quiet refs/heads/main ||
            git branch --track main origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test release safety contracts
        run: pnpm test:release-safety

      - name: Enforce Changeset policy
        env:
          CHANGESET_POLICY_BRANCH: ${{ github.head_ref || github.ref_name }}
          CHANGESET_POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CHANGESET_POLICY_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: pnpm test:changesets

      - name: Validate launch changeset
        run: pnpm test:launch

      - name: Test API reference generation
        run: pnpm --filter docs test:api

      - name: Check generated API reference
        run: pnpm --filter docs docs:api:check

      - name: Test documentation contracts and snippets
        run: pnpm test:docs

      - name: Test with coverage (100% enforced)
        run: pnpm test:coverage

      - name: Check intentional error contracts
        run: pnpm test:errors

      - name: Test reachable core bundle size
        run: pnpm test:size

      - name: Test packed packages
        run: pnpm test:packages

      - name: Build documentation
        run: pnpm --filter docs build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/core/coverage/lcov.info
          flags: unittests
