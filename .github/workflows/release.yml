name: Release

# A main-branch push either refreshes the draft version pull request or publishes
# a reviewed version commit. Quality, versioning, and publication use separate
# least-privilege jobs.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should_version: ${{ steps.release-mode.outputs.should_version }}
      should_publish: ${{ steps.release-mode.outputs.should_publish }}
      publish_command: ${{ steps.release-mode.outputs.publish_command }}
      release_state: ${{ steps.release-mode.outputs.release_state }}
      expected_packages: ${{ steps.release-mode.outputs.expected_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Changesets base branch
        run: |
          git show-ref --verify --quiet refs/heads/main ||
            git branch --track main origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm test:security

      - name: Detect release mode
        id: release-mode
        env:
          CHANGESET_POLICY_BRANCH: ${{ github.ref_name }}
          CHANGESET_POLICY_HEAD_REPOSITORY: ${{ github.repository }}
          CHANGESET_POLICY_BASE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'
          import {
            detectReleaseMode,
            isChangesetReaderPath,
            parseNullDelimitedPaths,
            runChangesetPolicy,
          } from './scripts/test-changeset-policy.mjs'
          import {
            createExpectedPublicationPlan,
            loadPublishedPackageSpecs,
          } from './scripts/verify-published-packages.mjs'

          const output = execFileSync(
            'git',
            ['ls-files', '-z', '--', '.changeset'],
            {
              encoding: null,
              killSignal: 'SIGKILL',
              maxBuffer: 16 * 1024 * 1024,
              shell: false,
              stdio: ['ignore', 'pipe', 'pipe'],
              timeout: 120_000,
            },
          )
          const paths = parseNullDelimitedPaths(output)
          const changesetPaths = paths.filter(isChangesetReaderPath)
          const prereleaseStateSource = existsSync('.changeset/pre.json')
            ? readFileSync('.changeset/pre.json')
            : undefined
          const policy = runChangesetPolicy({ write: () => {} })
          const generatedVersionCommit =
            policy.reason === 'generated-version-commit'
          const releaseMode = detectReleaseMode({
            changesetPaths,
            policy,
            prereleaseStateSource,
          })
          const expectedPackages = releaseMode.shouldPublish && generatedVersionCommit
            ? createExpectedPublicationPlan(
                policy.versionedPackages,
                loadPublishedPackageSpecs(),
              )
            : []
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `should_version=${releaseMode.shouldVersion}\nshould_publish=${releaseMode.shouldPublish}\npublish_command=${releaseMode.publishCommand ?? ''}\nrelease_state=${releaseMode.state}\nexpected_packages=${JSON.stringify(expectedPackages)}\n`,
          )
          NODE

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test release safety contracts
        run: pnpm test:release-safety

      - name: Enforce Changeset policy
        env:
          CHANGESET_POLICY_BRANCH: ${{ github.head_ref || github.ref_name }}
          CHANGESET_POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CHANGESET_POLICY_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: pnpm test:changesets

      - name: Validate launch metadata
        run: pnpm test:launch

      - name: Test API reference generation
        run: pnpm --filter docs test:api

      - name: Check generated API reference
        run: pnpm --filter docs docs:api:check

      - name: Test documentation contracts and snippets
        run: pnpm test:docs

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Check intentional error contracts
        run: pnpm test:errors

      - name: Test reachable core bundle size
        run: pnpm test:size

      - name: Test packed packages
        run: pnpm test:packages

      - name: Build documentation
        run: pnpm --filter docs build

  version:
    name: Version packages
    needs: quality
    if: needs.quality.outputs.should_version == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        run: |
          pnpm changeset version
          pnpm install --lockfile-only

      - name: Create or update release PR
        id: version-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/glucoseiq-packages
          delete-branch: true
          base: main
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages'
          body-path: .github/release-pr-body.md
          draft: always-true
          add-paths: |
            .changeset/*.md
            .changeset/pre.json
            packages/*/package.json
            packages/*/CHANGELOG.md
            pnpm-lock.yaml
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          sign-commits: true

      - name: Require release candidate
        if: steps.version-pr.outputs.pull-request-head-sha == ''
        run: |
          echo "::error::Release entries exist but no release-candidate commit was created."
          exit 1

      - name: Checkout release candidate
        if: steps.version-pr.outputs.pull-request-head-sha != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.version-pr.outputs.pull-request-head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install candidate dependencies
        if: steps.version-pr.outputs.pull-request-head-sha != ''
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        if: steps.version-pr.outputs.pull-request-head-sha != ''
        id: candidate
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm test:security
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test:release-safety
          pnpm test:launch
          pnpm --filter docs test:api
          pnpm --filter docs docs:api:check
          pnpm test:docs
          pnpm test:coverage
          pnpm test:errors
          pnpm test:size
          pnpm test:packages:candidate
          pnpm --filter docs build

      - name: Publish candidate check
        if: always() && steps.version-pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.version-pr.outputs.pull-request-head-sha }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          DETAILS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_OUTCOME" = "success" ]; then
            CONCLUSION=success
            SUMMARY="The versioned package candidate passed every release gate."
          else
            CONCLUSION=failure
            SUMMARY="The versioned package candidate failed one or more release gates."
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/check-runs" \
            --raw-field name='Build & test (Node 24)' \
            --raw-field head_sha="$CANDIDATE_SHA" \
            --raw-field status=completed \
            --raw-field conclusion="$CONCLUSION" \
            --raw-field details_url="$DETAILS_URL" \
            --raw-field 'output[title]=Release candidate verification' \
            --raw-field "output[summary]=$SUMMARY"

      - name: Enforce candidate result
        if: steps.candidate.outcome != 'success'
        run: |
          echo "::error::The release candidate did not pass every required gate."
          exit 1

  publish:
    name: Publish packages
    needs: quality
    if: needs.quality.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publication artifacts
        run: pnpm build

      - name: Verify versioned tarballs
        run: pnpm test:packages:candidate

      - name: Verify live documentation domain
        run: node scripts/release-preflight.mjs

      - name: Publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: ${{ needs.quality.outputs.publish_command }}
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Resolve publication inventory
        id: publication-inventory
        if: ${{ !cancelled() && (steps.changesets.outcome == 'success' || steps.changesets.outcome == 'failure') }}
        env:
          CHANGESETS_ACTION_OUTCOME: ${{ steps.changesets.outcome }}
          CHANGESETS_PUBLISHED: ${{ steps.changesets.outputs.published }}
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          EXPECTED_PUBLISHED_PACKAGES: ${{ needs.quality.outputs.expected_packages }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import {
            loadPublishedPackageSpecs,
            resolvePublicationInventory,
          } from './scripts/verify-published-packages.mjs'

          const inventory = resolvePublicationInventory(
            {
              actionOutcome: process.env.CHANGESETS_ACTION_OUTCOME,
              published: process.env.CHANGESETS_PUBLISHED,
              publishedPackages: process.env.CHANGESETS_PUBLISHED_PACKAGES,
              expectedPackages: process.env.EXPECTED_PUBLISHED_PACKAGES,
            },
            loadPublishedPackageSpecs(),
          )
          const reportedPackages = inventory.reportedPackages.map(({ name, version }) => ({
            name,
            version,
          }))
          const verificationPackages = inventory.verificationPackages.map(
            ({ name, version }) => ({ name, version }),
          )
          console.log(
            `Publication inventory source: ${inventory.source}; reported: ${JSON.stringify(reportedPackages)}; HEAD verification plan: ${JSON.stringify(verificationPackages)}`,
          )
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `reported_packages=${JSON.stringify(reportedPackages)}\nverification_packages=${JSON.stringify(verificationPackages)}\nsource=${inventory.source}\n`,
          )
          NODE


      - name: Remove npm authentication
        id: npm-auth-cleanup
        if: ${{ !cancelled() && (steps.changesets.outcome == 'success' || steps.changesets.outcome == 'failure') }}
        run: |
          node --input-type=module <<'NODE'
          import { join } from 'node:path'
          import { scrubUserNpmAuth } from './scripts/verify-published-packages.mjs'

          if (!process.env.HOME) throw new Error('HOME must be available for npm authentication cleanup')
          const userConfig = join(process.env.HOME, '.npmrc')
          const result = scrubUserNpmAuth({ userConfig })
          console.log(`Removed ${result.removed} npm authentication entries from the user configuration.`)
          NODE

      - name: Verify published packages
        if: ${{ !cancelled() && steps.publication-inventory.outcome == 'success' && steps.npm-auth-cleanup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGESETS_VERIFICATION_PACKAGES: ${{ steps.publication-inventory.outputs.verification_packages }}
        run: node scripts/verify-published-packages.mjs
