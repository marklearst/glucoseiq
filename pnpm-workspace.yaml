  "markdown-it@<14.3.3": 14.3.3
  "minimatch@<11.0.1": 11.0.1
  "picomatch@": 4.0.5
  "postcss@": 8.5.25
  "rollup@": 4.62.4
  "tsup@": 8.4.0
  "vite@>=6 <6.4.5": 6.4.5
  "yaml@": 2.8.3
  "js-yaml@>=3 <3.15.2": 3.15.2
  "js-yaml@>=4 <4.3.2": 4.3.2
  "nanoid@>=3 <3.3.18": 3.3.20
  "browserslist@<4.28.7": 4.28.7
  "fast-uri@>=3 <3.1.9": 3.1.9
